    <meta name="theme-color" content="#ffffff" />
    <script>
      // Before first paint: saved theme, else the OS preference. Also cover the pre-rendered page
      // while the once-per-session boot intro is about to mount (removed by React, or after 4s).
      (function () {
        var d = document.documentElement, t = null;
        try { t = localStorage.getItem('kp-theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        d.setAttribute('data-theme', t);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'dark' ? '#050505' : '#ffffff');
        var boot = false;
        try {
          boot = sessionStorage.getItem('kp-boot-shown') !== '1' &&
            !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
        } catch (e) {}
        if (boot) {
          d.classList.add('kp-boot');
          setTimeout(function () { d.classList.remove('kp-boot'); }, 4000);
        }
      })();
    </script>
    <style>html.kp-boot body { visibility: hidden; } html[data-theme='dark'] { background: #050505; }</style>
