<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ken Paco | Electrical Engineering Portfolio</title>
    <meta name="description" content="John Kenneth S. Paco: BS Electrical Engineering student and DOLE Safety Officer 2 building embedded and IoT systems, including an RP2040 + LoRa acoustic sensor for illegal logging detection." />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Apply the saved theme before first paint (default: light; system preference is not used).
      (function () {
        var t = 'light';
        try { if (localStorage.getItem('kp-theme') === 'dark') t = 'dark'; } catch (e) {}
        document.documentElement.setAttribute('data-theme', t);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'dark' ? '#000000' : '#ffffff');
      })();
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />

    <meta property="og:title" content="Ken Paco | Electrical Engineering Portfolio" />
    <meta property="og:description" content="Embedded systems, IoT and signal processing projects by John Kenneth S. Paco." />
    <meta property="og:url" content="https://johnkennethpax.github.io/" />
    <meta property="og:image" content="https://johnkennethpax.github.io/img/headshot.jpg" />
