<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CV | John Kenneth S. Paco</title>
    <meta name="description" content="Curriculum vitae of John Kenneth S. Paco, BS Electrical Engineering student and Qualified Safety Officer 2." />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Before first paint: saved theme, else the OS preference.
      (function () {
        var t = null;
        try { t = localStorage.getItem('kp-theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'dark' ? '#050505' : '#ffffff');
      })();
    </script>
    <link rel="canonical" href="https://johnkennethpax.github.io/resume/" />
