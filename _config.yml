# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.

# Main Page Setup

title: John Kenneth Paco | Portfolio # This is what shows up in the tab of the browser



# Hero Section
name: John Kenneth Paco
first_name: John Kenneth # shown after "I'm" in the hero
headline: Electrical Engineering Student | Embedded Systems
description: >- # dont remove this line. this will ignore all new lines until the next section
  BS Electrical Engineering student at St. Peter's College, Iligan City (expected 2027),
  working with embedded systems, sensor interfacing, and signal processing on Arduino and
  Raspberry Pi Pico (RP2040). My undergraduate thesis, in progress, is a LoRa-linked acoustic
  sensor node that uses FFT to detect chainsaw sounds for illegal logging prevention.
  COSH-trained Safety Officer 2 (SO2).

# Place your profile image in /assets/images/profile-image/folder and edit the file name
profile_image: ./assets/images/profile-image/headshot.jpg


# Link your resume
# You can place your resume in assets/resume/{resume.pdf or add external link such as pdf saved in google drive 
resume-url: https://www.linkedin.com/in/johnkennethpaco/ # replace with /assets/resume/Resume.pdf once your own PDF is uploaded


# Set up external links - this will show up as small icons next to your name.

external-links:    # input only your own url slug. The icons with missing entries will not appear.
  linkedin: johnkennethpaco    # https://www.linkedin.com/in/{your url slug} 
  github: cerealboy7    # https://github.com/{your url slug} 
  stackoverflow:      # https://stackoverflow.com/users/{your url slug}
  medium:            # https://medium.com/@{your url slug} 
  x-twitter:   # https://x.com/{your url slug} 
  threads:            # https://threads.net/@{your url slug} 
  instragram:       # https://instagram.com/{your url slug} 
  youtube:           # https://youtube.com/@{your url slug} 
  discord:            # https://discord.com/users/{your url slug} 
  bluesky:           # https://bsky.app/profile/{your url slug} 
  

# Skills Section - Add the list of your Skills by categories/tools. The indentation for each level needs to be precise. 
skills:
  - category: Electrical and Hardware
    tools:
    - Circuit Assembly
    - Wiring
    - Sensor Interfacing
    - Troubleshooting
  - category: Embedded Systems
    tools:
    - Arduino
    - Raspberry Pi Pico (RP2040)
    - I2C / SPI / UART
    - C++
    - Fast Fourier Transform (FFT)
    - LoRa P2P
  - category: Software and Tools
    tools:
    - Python
    - Git
    - QGIS
    - Microsoft Excel
    - Microsoft Word
  - category: Safety
    tools:
    - Construction Occupational Safety and Health (COSH) SO2


# Contact Form Setup. Setup an account and copy over the key. When someone fills out the form, it will be received in your email.
formspree-key:    # only the 8-character ID from your Formspree form URL, not the full URL



