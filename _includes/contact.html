<!-- SECTION 4: Contact-->
<section id="contact" class="contact-section">
    <h2>Contact</h2>
    <div class="contact-links">
        {% if site.email %}
        <a href="mailto:{{ site.email }}"><i class="fa-solid fa-envelope"></i> {{ site.email }}</a>
        {% endif %}
        {% if site.external-links.linkedin %}
        <a href="https://www.linkedin.com/in/{{ site.external-links.linkedin }}/" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-linkedin"></i> LinkedIn</a>
        {% endif %}
    </div>
</section>
